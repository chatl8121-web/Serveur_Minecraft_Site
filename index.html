<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site - Style Violet Bleu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #667eea 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Titre animé */
        .titre-container {
            text-align: center;
            margin-bottom: 80px;
            z-index: 10;
        }

        .titre {
            font-size: 3.5em;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Conteneur des bulles */
        .bulles-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-items: center;
        }

        /* Bulle */
        .bulle {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: popIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .bulle:nth-child(1) { animation-delay: 0.1s; }
        .bulle:nth-child(2) { animation-delay: 0.2s; }
        .bulle:nth-child(3) { animation-delay: 0.3s; }
        .bulle:nth-child(4) { animation-delay: 0.4s; }
        .bulle:nth-child(5) { animation-delay: 0.5s; }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .bulle:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .numero {
            font-size: 3em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .texte-bulle {
            font-size: 0.9em;
            color: #ffffff;
            text-align: center;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .bulles-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            .titre {
                font-size: 2.5em;
            }

            .bulles-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .bulle {
                width: 150px;
                height: 150px;
            }

            .numero {
                font-size: 2.5em;
            }

            .texte-bulle {
                font-size: 0.8em;
            }
        }

        @media (max-width: 480px) {
            .titre {
                font-size: 2em;
                margin-bottom: 40px;
            }

            .bulles-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .bulle {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="titre-container">
        <h1 class="titre">Bienvenue</h1>
    </div>

    <div class="bulles-container">
        <div class="bulle">
            <div class="numero">1</div>
            <div class="texte-bulle">Titre Bulle 1</div>
        </div>
        <div class="bulle">
            <div class="numero">2</div>
            <div class="texte-bulle">Titre Bulle 2</div>
        </div>
        <div class="bulle">
            <div class="numero">3</div>
            <div class="texte-bulle">Titre Bulle 3</div>
        </div>
        <div class="bulle">
            <div class="numero">4</div>
            <div class="texte-bulle">Titre Bulle 4</div>
        </div>
        <div class="bulle">
            <div class="numero">5</div>
            <div class="texte-bulle">Titre Bulle 5</div>
        </div>
    </div>
</body>
</html>
